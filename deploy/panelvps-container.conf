# PanelVPS —— 容器（LXC / Docker 内的 systemd）专用覆盖
#
# 由 install.sh 在检测到容器时安装到：
#   /etc/systemd/system/panelvps.service.d/container.conf
#
# 为什么需要这份覆盖：
# 主单元里的加固项在真机上是对的，但容器的边界由 LXC/Docker 提供，
# 容器内的 systemd 往往没有 CAP_SYS_ADMIN / CAP_NET_ADMIN，也没有
# 被委托的 cgroup 写权限。这些指令会直接让 systemd 拒绝启动服务：
#   Failed to set ambient capabilities: Operation not permitted
#   Failed to set up mount namespacing: Permission denied
#   Cannot set property MemoryMax, or unknown property
#
# 注意：systemd 中「空赋值」表示重置为默认值，不是删除。

[Service]
# 非特权容器没有 NET_ADMIN / NET_RAW。
# AmbientCapabilities 要求该能力已在 permitted 集合里，否则启动即失败。
AmbientCapabilities=
CapabilityBoundingSet=

# cgroup v1，或 cgroup2 未把 memory 控制器委托给容器时，写 memory.max 会失败
MemoryMax=

# 这些选项都要在容器内重新挂载根文件系统 / proc / sys。
# 部分 LXC 配置（apparmor profile、只读 bind mount）下会失败。
ProtectSystem=
ProtectHome=
ProtectKernelTunables=
ProtectKernelModules=
ProtectControlGroups=

# 保留：与容器权限无关，且仍然有益
#   PrivateTmp=yes
#   RestrictSUIDSGID=yes
#   LockPersonality=yes
#   RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
