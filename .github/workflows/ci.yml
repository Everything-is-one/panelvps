name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: 下载依赖
        run: go mod download

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请执行 gofmt -w cmd internal："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 交叉编译
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/panelvps
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/panelvps

      - name: 脚本语法
        run: |
          bash -n deploy/install.sh
          bash -n deploy/bootstrap.sh
          bash -n scripts/build.sh
          bash -n scripts/publish.sh
          python3 -m py_compile scripts/smoke_test.py
