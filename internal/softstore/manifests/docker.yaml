slug: docker
name: Docker (docker.io)
category: container
summary: 容器运行时，来自 Debian 官方源
version: "20.10"
memory_mb: 250
disk_mb: 900
ports: []
deps: []
conflicts: [docker-ce, containerd]
risk: high
warning: 本机 4.14 内核必须先在 GRUB 加 systemd.unified_cgroup_hierarchy=0 并重启，否则容器会一直停在 Created；1GB 机器上装完可用内存会明显变紧，不建议与 MariaDB 同时使用。
plan:
  install:
    - apt: { names: [docker.io], update: true }
    - service: { name: docker, enable: true, start: true }
    - check: { cmd: ["docker", "version"] }
  uninstall:
    - service: { name: docker, stop: true, disable: true }
    - apt: { names: [docker.io], purge: true }
